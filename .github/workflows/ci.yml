name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Matches .nvmrc (Node 24, the pinned version used locally).
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Backend typecheck ────────────────────────────────────────────────────────
      # Runs `tsc --noEmit -p tsconfig.spec.json` (the project's actual
      # `npm run typecheck` script).
      - name: Backend typecheck
        run: npm run typecheck

      # ── Backend lint ──────────────────────────────────────────────────────────────
      # Runs ESLint over the backend source + contracts package only (`src/**` and
      # `packages/**`). The frontend in `apps/web` is intentionally excluded
      # from linting — see the ESLINT-002 follow-up ticket (ESLint version
      # conflict in apps/web).
      - name: Backend lint
        run: npm run lint

      # ── Frontend typecheck ────────────────────────────────────────────────────────
      # `apps/web` lives in its own npm workspace but keeps its own tsconfig.
      - name: Frontend typecheck
        run: cd apps/web && npm run typecheck

      # ── Full backend test suite ────────────────────────────────────────────────────
      # Runs every Jest suite (currently 70 suites / 700+ tests), isolated from
      # any .env file so tests never reach out to real services.
      - name: Backend tests
        run: npx jest --passWithNoTests

      # ── Frontend ESLint (explicitly SKIPPED) ──────────────────────────────
      # Frontend lint is deferred — the apps/web ESLint version conflict was tracked
      # as its own ticket (ESLINT-002) and is intentionally NOT part of this
      # pipeline. The workflow must not fail or warn about its absence here.
      # Follow-up: re-enable `cd apps/web && npm run lint` once that ticket
      # lands.
