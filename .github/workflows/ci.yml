name: CI

on:
  push:
    branches: [main, phase-6]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # ── Postgres (matches docker-compose.yml: postgres:16-alpine) ────────────────
    # The same image the project runs locally, so the schema is built against the
    # same server version CI's tests assume. Published on 5432 and reachable at
    # localhost, because this job runs on the VM rather than inside a container.
    # Credentials mirror docker-compose.yml's and src/data-source.ts's fallbacks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Redis service (matches docker-compose.yml: redis:7-alpine) ───────────────
      # The same image the project runs locally, and the server the DB-backed report
      # suites connect to at redis://127.0.0.1:6379 for §10's consecutive-failure
      # counter and the §7.3 debounce lock. Those suites skip when DB_HOST is unset,
      # but this job sets DB_HOST above, so they run here and need Redis reachable.
      # No `env:` block: unlike Postgres, Redis here is unauthenticated, matching the
      # compose service's shape (ports + healthcheck only).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Database and Redis connection for the DB-backed suites. Job-scoped so the
    # migration step and the test step cannot drift apart. Suites that need a
    # database run when these are set and skip when they are not, which is what
    # keeps a local `npm test` with no Postgres passing. REDIS_HOST/REDIS_PORT are
    # the keys src/app.module.ts's global CacheModule reads; their defaults are the
    # same localhost:6379, but stating them keeps CI's Redis wiring explicit.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: gym_management
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      DB_ADMIN_DATABASE: postgres
      REPORTING_MV_INTEGRATION: "1"

    # Matches .nvmrc (Node 24, the pinned version used locally).
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Backend typecheck ────────────────────────────────────────────────────────
      # Runs `tsc --noEmit -p tsconfig.spec.json` (the project's actual
      # `npm run typecheck` script).
      - name: Backend typecheck
        run: npm run typecheck

      # ── Backend lint ──────────────────────────────────────────────────────────────
      # Runs ESLint over the backend source + contracts package only (`src/**` and
      # `packages/**`). The frontend in `apps/web` is intentionally excluded
      # from linting — see the ESLINT-002 follow-up ticket (ESLint version
      # conflict in apps/web).
      - name: Backend lint
        run: npm run lint

      # ── Frontend typecheck ────────────────────────────────────────────────────────
      # `apps/web` lives in its own npm workspace but keeps its own tsconfig.
      - name: Frontend typecheck
        run: cd apps/web && npm run typecheck

      # ── Database setup for the DB-backed suites ────────────────────────────────────
      # src/migrations/*.ts call uuid_generate_v4() and NO migration creates the
      # extension, so it must exist before the schema is built -- the same
      # requirement the DB-backed spec's own error message names for local runs.
      - name: Create Postgres extensions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d gym_management -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      # Builds the schema the suites run against. The DB-backed loyalty spec also
      # calls runMigrations() itself, so this is belt-and-braces: it makes the job's
      # database state explicit and fails here, with a migration error, rather than
      # somewhere inside a test.
      - name: Run migrations
        run: npm run migration:run

      # ── Full backend test suite ────────────────────────────────────────────────────
      # Runs every Jest suite. Jest still never loads a .env file (jest.config.js is
      # explicit about that); the DB_* variables above come from the job environment
      # and point at the Postgres service, which is what makes the DB-backed suites
      # run here instead of skipping.
      - name: Backend tests
        run: npx jest --passWithNoTests

      # ── Frontend ESLint (explicitly SKIPPED) ──────────────────────────────
      # Frontend lint is deferred — the apps/web ESLint version conflict was tracked
      # as its own ticket (ESLINT-002) and is intentionally NOT part of this
      # pipeline. The workflow must not fail or warn about its absence here.
      # Follow-up: re-enable `cd apps/web && npm run lint` once that ticket
      # lands.
